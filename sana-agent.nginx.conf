server {
    server_name sana-agent.flen-vpn.xyz;
    root /opt/tou-sana-agent;
    index index.html;
    client_max_body_size 0;

    # ------------------------------------------------------------------ #
    # Service files are closed. The site root is the application folder,
    # so without these rules nginx would serve code, the database, logs
    # and backups. 404 rather than 403 so we do not confirm a file exists.
    # /api/ and /desktop-api/ are ^~ prefixes, so these regexes never
    # apply to them.
    # ------------------------------------------------------------------ #
    location ~ ^/(?:backups|data|exec_env|exec_runs|skills|vendor|venv|__pycache__|node_modules)(?:/|$) {
        return 404;
    }
    location ~ /\.(?!well-known/) {
        return 404;
    }
    location ~* (?:\.(?:py|pyc|pyo|sh|cfg|ini|toml|ya?ml|md|env|log|zip|tar|gz|tgz|7z|rar)|\.(?:db|sqlite3?)(?:-(?:wal|shm|journal))?|\.log\.\d+|\.bak[^/]*)$ {
        return 404;
    }
    location = /requirements.txt { return 404; }
    location = /router_stats.json { return 404; }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Accel-Buffering no;
    }

    # ------------------------------------------------------------------ #
    # ToU Sana Agent - desktop backend
    # The prefix is stripped, so the Node service sees plain /auth, /chats…
    # ------------------------------------------------------------------ #

    location ^~ /desktop-api/auth/ {
        limit_req zone=tou_auth burst=6 nodelay;
        limit_conn tou_conn 12;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:8015/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 8m;
    }

    location ^~ /desktop-api/ {
        limit_req zone=tou_api burst=60 nodelay;
        limit_conn tou_conn 32;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:8015/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streaming agent responses must not be buffered or timed out early.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_set_header X-Accel-Buffering no;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        client_max_body_size 48m;
    }

    # Health probe used by the desktop client for its connection indicator.
    # It exposes no secrets - only the active model names and a boolean for the
    # database and sandbox - which matches what the web front end already
    # publishes at /api/health. Rate limited so it cannot be used to amplify.
    location = /desktop-api/health {
        limit_req zone=tou_api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8015/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_buffering off;
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|css|js|woff2|ttf|exe|dll)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = / {
        try_files /d/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /dist/ {
        return 404;
    }

    # ------------------------------------------------------------------ #
    # TeleChess game at https://sana-agent.flen-vpn.xyz/gaems/
    # Files live in /var/www/gaems (separate folder, static only).
    # ^~ keeps the site-wide regex locations from applying here.
    # ------------------------------------------------------------------ #
    location ^~ /gaems/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    http2 on;
    ssl_certificate /etc/letsencrypt/live/sana-agent.flen-vpn.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sana-agent.flen-vpn.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = sana-agent.flen-vpn.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name sana-agent.flen-vpn.xyz;
    return 404; # managed by Certbot


}